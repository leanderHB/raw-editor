<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>RAW Editor</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #1a1a1a; color: #eee; }
  #toolbar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: #262626; border-bottom: 1px solid #000; }
  #toolbar button { background: #3a3a3a; color: #eee; border: 1px solid #555; border-radius: 4px; padding: 6px 12px; cursor: pointer; }
  #toolbar button:hover { background: #454545; }
  #toolbar button:disabled { opacity: 0.5; cursor: default; }
  #status { font-size: 13px; color: #9cf; margin-left: 8px; }
  #layout { display: flex; height: calc(100vh - 46px); }
  #sidebar { width: 130px; flex-shrink: 0; background: #1c1c1c; border-right: 1px solid #000; overflow-y: auto; padding: 6px; box-sizing: border-box; }
  #sidebar.hidden { display: none; }
  .thumb-item { cursor: pointer; margin-bottom: 6px; border-radius: 4px; padding: 4px; border: 1px solid transparent; }
  .thumb-item:hover { background: #262626; }
  .thumb-item.active { border-color: #8ec9ff; background: #263140; }
  .thumb-item .thumb-img, .thumb-item .thumb-placeholder {
    width: 100%; aspect-ratio: 3/2; border-radius: 3px; background: #111;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .thumb-item .thumb-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb-item .thumb-placeholder { color: #555; font-size: 9px; text-align: center; padding: 4px; }
  .thumb-item .thumb-name { font-size: 9px; color: #999; margin-top: 3px; word-break: break-all; line-height: 1.2; }
  #canvasWrap { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #111; }
  canvas { max-width: 100%; max-height: 100%; }
  #placeholder { color: #666; font-size: 15px; }
  #panel { width: 260px; padding: 12px 16px; box-sizing: border-box; background: #222; overflow-y: auto; }
  .slider { margin-bottom: 7px; }
  .slider label { display: flex; justify-content: space-between; font-size: 11px; color: #aaa; margin-bottom: 1px; line-height: 1.3; }
  .slider input[type="range"] {
    width: 100%;
    display: block;
    margin: 0;
    height: 14px;
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
    cursor: pointer;
  }
  .slider input[type="range"]::-webkit-slider-runnable-track { height: 3px; background: #4a4a4a; border-radius: 2px; }
  .slider input[type="range"]::-moz-range-track { height: 3px; background: #4a4a4a; border-radius: 2px; }
  .slider input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 11px; height: 11px; border-radius: 50%;
    background: #8ec9ff; margin-top: -4px; cursor: pointer;
  }
  .slider input[type="range"]::-moz-range-thumb {
    width: 11px; height: 11px; border-radius: 50%;
    background: #8ec9ff; border: none; cursor: pointer;
  }
  .section-title { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: #888; margin: 0 0 6px; border-top: 1px solid #333; padding-top: 10px; }
  .section-title:first-child { border-top: none; padding-top: 0; }
  #curveWrap { position: relative; width: 220px; height: 150px; margin: 0 auto 4px; background-image: radial-gradient(#444 1px, transparent 0); background-size: 10% 10%; background-color: #1a1a1a; border: 1px solid #444; border-radius: 6px; touch-action: none; }
  #curveCanvas { position: absolute; inset: 0; }
  .curve-hint { font-size: 10px; color: #777; text-align: center; margin-bottom: 10px; line-height: 1.3; }
</style>
</head>
<body>
<div id="toolbar">
  <button id="toggleSidebarBtn" title="Show/hide image list">☰</button>
  <button id="openBtn">Open RAW…</button>
  <input id="fileInput" type="file" accept=".arw,.ARW" multiple style="display:none">
  <button id="exportBtn" disabled>Export…</button>
  <button id="resetBtn" disabled>Reset</button>
  <button id="rotate90Btn" disabled title="Rotate 90° clockwise">⟳ 90°</button>
  <label style="display:flex;align-items:center;gap:4px;font-size:13px;margin-left:8px;">
    <input id="sonyLook" type="checkbox"> Sony Look
  </label>
  <span id="status">no file open</span>
</div>
<div id="layout">
  <div id="sidebar"></div>
  <div id="canvasWrap"><span id="placeholder">Open one or more .ARW files to begin</span></div>
  <div id="panel">
    <div class="section-title">Geometry</div>
    <div class="slider"><label><span>Straighten</span><span id="straightenVal">0.00</span></label><input id="straighten" type="range" min="-45" max="45" step="0.1" value="0"></div>

    <div class="section-title">Tone Curve</div>
    <div id="curveWrap">
      <canvas id="curveCanvas" width="220" height="150"></canvas>
    </div>
    <div class="curve-hint">click to add a point · double-click a point to remove it · drag an end point inward to detach it from the border (clips to a flat line)</div>

    <div class="section-title">Light &amp; Color</div>
    <div class="slider"><label><span>Exposure</span><span id="exposureVal">0.00</span></label><input id="exposure" type="range" min="-2" max="2" step="0.01" value="0"></div>
    <div class="slider"><label><span>Contrast</span><span id="contrastVal">0.00</span></label><input id="contrast" type="range" min="-1" max="1" step="0.01" value="0"></div>
    <div class="slider"><label><span>Highlights</span><span id="highlightsVal">0.00</span></label><input id="highlights" type="range" min="-1" max="1" step="0.01" value="0"></div>
    <div class="slider"><label><span>Shadows</span><span id="shadowsVal">0.00</span></label><input id="shadows" type="range" min="-1" max="1" step="0.01" value="0"></div>
    <div class="slider"><label><span>Whites</span><span id="whitesVal">0.00</span></label><input id="whites" type="range" min="-1" max="1" step="0.01" value="0"></div>
    <div class="slider"><label><span>Blacks</span><span id="blacksVal">0.00</span></label><input id="blacks" type="range" min="-1" max="1" step="0.01" value="0"></div>
    <div class="slider"><label><span>Saturation</span><span id="saturationVal">0.00</span></label><input id="saturation" type="range" min="-1" max="1" step="0.01" value="0"></div>
    <div class="slider"><label><span>Temperature</span><span id="temperatureVal">0.00</span></label><input id="temperature" type="range" min="-1" max="1" step="0.01" value="0"></div>
    <div class="slider"><label><span>Tint</span><span id="tintVal">0.00</span></label><input id="tint" type="range" min="-1" max="1" step="0.01" value="0"></div>
    <div class="slider"><label><span>Vibrance</span><span id="vibranceVal">0.00</span></label><input id="vibrance" type="range" min="-1" max="1" step="0.01" value="0"></div>

    <div class="section-title">Detail &amp; Effects</div>
    <div class="slider"><label><span>Clarity</span><span id="clarityVal">0.00</span></label><input id="clarity" type="range" min="-1" max="1" step="0.01" value="0"></div>
    <div class="slider"><label><span>Dehaze</span><span id="dehazeVal">0.00</span></label><input id="dehaze" type="range" min="-1" max="1" step="0.01" value="0"></div>
    <div class="slider"><label><span>Vignette</span><span id="vignetteVal">0.00</span></label><input id="vignette" type="range" min="0" max="1" step="0.01" value="0"></div>
    <div class="slider"><label><span>Bloom</span><span id="bloomVal">0.00</span></label><input id="bloom" type="range" min="0" max="1" step="0.01" value="0"></div>
    <div class="slider"><label><span>Anti-aberration</span><span id="defringeVal">0.00</span></label><input id="defringe" type="range" min="0" max="1" step="0.01" value="0"></div>
  </div>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
